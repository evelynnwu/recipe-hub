AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Recipe Hub Backend - Serverless API
Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.9
    Environment:
      Variables:
        PYTHONPATH: /var/runtime
Resources:
  RecipeHubApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: '''GET,POST,OPTIONS'''
        AllowHeaders: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
        AllowOrigin: '''*'''
  ParseRecipeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ParseRecipeFunction
      Handler: parse_recipe.lambda_handler
      Description: Parse recipes from URLs
      Events:
        ParseRecipe:
          Type: Api
          Properties:
            RestApiId:
              Ref: RecipeHubApi
            Path: /api/parse
            Method: post
        ParseRecipeOptions:
          Type: Api
          Properties:
            RestApiId:
              Ref: RecipeHubApi
            Path: /api/parse
            Method: options
    Metadata:
      SamResourceId: ParseRecipeFunction
  HealthCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: HealthCheckFunction
      Handler: health_check.lambda_handler
      Description: Health check endpoint
      Events:
        HealthCheck:
          Type: Api
          Properties:
            RestApiId:
              Ref: RecipeHubApi
            Path: /api/health
            Method: get
        HealthCheckOptions:
          Type: Api
          Properties:
            RestApiId:
              Ref: RecipeHubApi
            Path: /api/health
            Method: options
    Metadata:
      SamResourceId: HealthCheckFunction
Outputs:
  RecipeHubApiUrl:
    Description: API Gateway endpoint URL for Recipe Hub
    Value:
      Fn::Sub: https://${RecipeHubApi}.execute-api.${AWS::Region}.amazonaws.com/prod/
    Export:
      Name: RecipeHubApiUrl
  ParseRecipeApi:
    Description: API Gateway endpoint URL for Parse Recipe function
    Value:
      Fn::Sub: https://${RecipeHubApi}.execute-api.${AWS::Region}.amazonaws.com/prod/api/parse
  HealthCheckApi:
    Description: API Gateway endpoint URL for Health Check function
    Value:
      Fn::Sub: https://${RecipeHubApi}.execute-api.${AWS::Region}.amazonaws.com/prod/api/health
